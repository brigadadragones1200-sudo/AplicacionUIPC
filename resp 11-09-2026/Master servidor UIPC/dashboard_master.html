<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard UIPC - Maestro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            padding: 20px 0;
            overflow-x: auto; 
        }

        .maqueta-container {
            width: 1964px;
            min-width: 1964px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 0 auto;
        }

        iframe {
            width: 100%;
            height: 100%;
            min-height: 100%;
            border: none;
            background: transparent;
        }

        /* TAG: encabezado exacto de 1964x64 */
        .encabezado {
            width: 1964px;
            height: 64px;
            background-color: #EFDDB1;
            overflow: hidden;
        }

        .content-wrapper {
            width: 1182px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .botonera {
            width: 1182px;
            height: 75px;
            background-color: #E2D1CC;
            border-radius: 25px;
            overflow: hidden;
        }

        .upper-grid {
            width: 1182px;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
        }

        /* Alturas dinámicas basadas en min-height para evitar scrollbars internos */
        .perfil {
            width: 344px;
            min-height: 650px;
            background-color: #B4C0C1;
            border-radius: 25px;
            overflow: visible;
        }

        .right-col {
            width: 740px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .actividades {
            width: 740px;
            min-height: 400px;
            background-color: #D6E2A8;
            border-radius: 25px;
            overflow: visible;
        }

        .minutas {
            width: 740px;
            min-height: 300px;
            background-color: #FFFFFF;
            border: 2px solid #1307EF;
            border-radius: 25px;
            overflow: visible;
        }

        .module-large {
            width: 1182px;
            min-height: 400px;
            border-radius: 25px;
            /* Se establece overflow hidden para los contenedores principales y evitar doble scrollbar */
            overflow: hidden; 
        }

        .frap {
            background-color: #F4D9BD;
            width: 1182px;
            min-height: 500px;
            border-radius: 25px;
            overflow: hidden;
        }
        .usuarios { background-color: #D0ACD1; }
        .documentos {
            background-color: #9AD8D6;
            width: 1182px;
            min-height: 600px;
            border-radius: 25px;
            overflow: hidden;
        }
        .directorio {
            background-color: #9E9ED8;
            width: 1182px;
            min-height: 500px;
            border-radius: 25px;
            overflow: hidden;
        }
        .conexiones {
            background-color: #dca3b4;
            width: 1182px;
            min-height: 700px;
            border-radius: 25px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="maqueta-container">
        
        <!-- Encabezado con Iframe directo -->
        <div class="encabezado">
            <iframe src="Modulos/encabezado.html" title="Encabezado"></iframe>
        </div>

        <div class="content-wrapper">

            <div class="botonera">
                <iframe src="Modulos/botonera.html" title="Botonera"></iframe>
            </div>

            <div class="upper-grid">
                <div class="perfil">
                    <iframe src="Modulos/perfil.html" title="Perfil"></iframe>
                </div>
                <div class="right-col">
                    <div class="actividades">
                        <iframe src="Modulos/actividades.html" title="Actividades"></iframe>
                    </div>
                    <div class="minutas">
                        <iframe src="Modulos/minutas.html" title="Minutas"></iframe>
                    </div>
                </div>
            </div>

            <div class="module-large frap">
                <iframe src="Modulos/frapc.html" title="FRAP"></iframe>
            </div>
            <div class="module-large usuarios">
                <iframe src="Modulos/usuarios.html" title="Usuarios"></iframe>
            </div>
            <div class="module-large documentos">
                <iframe src="Modulos/documentos.html" title="Documentos"></iframe>
            </div>
            <div class="module-large conexiones">
                <iframe src="Modulos/conexiones.html" title="Conexiones"></iframe>
            </div>
            <div class="module-large directorio">
                <iframe src="Modulos/directorio.html" title="Directorio"></iframe>
            </div>

        </div>
    </div>

</body>
</html>
