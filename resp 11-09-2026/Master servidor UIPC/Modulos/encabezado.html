<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encabezado UIPC</title>
    <!-- Favicon institucional -->
    <link rel="icon" type="image/png" href="logo_UIPC.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: transparent;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }
    </style>
</head>
<body class="bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-sm py-3 px-6">

    <header class="max-w-7xl mx-auto w-full flex items-center justify-between gap-4">
        
        <!-- Lado Izquierdo: Logo y Título -->
        <div class="flex items-center space-x-3">
            <div class="w-11 h-11 bg-white rounded-full flex items-center justify-center overflow-hidden shadow-md p-1 border-2 border-amber-400 flex-shrink-0">
                <img src="logo_UIPC.png" alt="Logo UIPC" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/44x44/1e3a8a/ffffff?text=UIPC'">
            </div>
            <div>
                <h1 class="text-sm sm:text-base font-extrabold text-blue-950 tracking-tight">Plataforma Digital UIPC de Protección Civil</h1>
                <p class="text-[11px] text-slate-500 font-medium">Unidad Interna de Protección Civil - Sesión Activa</p>
            </div>
        </div>

        <!-- Lado Derecho: Estado, Botón Cerrar Sesión y Nombre del Usuario -->
        <div class="flex items-center space-x-4">
            
            <!-- Indicador de Conexión -->
            <span class="hidden sm:inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 shadow-xs">
                <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                Conectado
            </span>

            <!-- Botón Cerrar Sesión (Rojo) -->
            <button onclick="logoutSession()" class="bg-red-600 hover:bg-red-700 text-white font-black px-4 py-2 rounded-xl text-xs shadow-md transition-all active:scale-95 cursor-pointer flex items-center space-x-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span>Cerrar Sesión</span>
            </button>

            <!-- Separador vertical -->
            <div class="h-6 w-px bg-slate-200 hidden md:block"></div>

            <!-- Nombre del Usuario Activo -->
            <div class="text-right hidden md:block">
                <div id="headerUserName" class="text-xs sm:text-sm font-black text-blue-950 tracking-tight">Cargando...</div>
                <div id="headerUserUr" class="text-[10px] font-bold text-slate-400 font-mono">--</div>
            </div>

        </div>

    </header>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            let userData = null;
            
            // 1. Obtener de localStorage de la sesión actual
            const userStr = localStorage.getItem('uipc_current_user');
            if (userStr) {
                try {
                    userData = JSON.parse(userStr);
                } catch(e) {}
            }

            // 2. Si no hay sesión local, consultar el servidor para obtener el usuario activo por defecto
            if (!userData) {
                try {
                    const res = await fetch('/api/admin/users');
                    const data = await res.json();
                    if (data.success && Array.isArray(data.users) && data.users.length > 0) {
                        userData = data.users[1];
                    }
                } catch(e) {}
            }

            // Fallback general
            if (!userData) {
                userData = {
                    nombre: 'Daniel González Pacheco',
                    ur: 'DGDy8NEM'
                };
            }

            // Inyectar datos en el DOM del encabezado
            document.getElementById('headerUserName').innerText = userData.nombre || 'Usuario General';
            document.getElementById('headerUserUr').innerText = userData.ur ? `UR: ${userData.ur}` : 'UR General';
        });

        // Función para cerrar sesión de manera segura
        function logoutSession() {
            localStorage.removeItem('uipc_current_user');
            // Redirigir al login o limpiar entorno
            if (window.parent && window.parent !== window) {
                window.parent.location.href = 'login.html';
            } else {
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
