<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Conexiones UIPC</title>
    <link rel="icon" type="image/png" href="logo_UIPC.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           PANEL DE CONTROL DE ESTILOS Y MEDIDAS (CONEXIONES)
           ========================================================= */
        body { 
            background: transparent;
            font-family: 'Inter', sans-serif; 
        }

        /* Altura máxima de la lista deslizable interna */
        .conexion-tabla-contenedor {
            max-height: 500px; 
        }

        /* Contenedor flotante idéntico al del directorio */
        .conexion-main {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid #fed7aa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .conexion-fila-hover:hover {
            background-color: rgba(255, 237, 213, 0.4);
            transition: background-color 0.2s ease;
        }
    </style>
</head>
<body class="h-auto flex flex-col text-orange-950 p-2 m-0 space-y-4">

    <main class="max-w-7xl mx-auto w-full conexion-main">
        
        <!-- Cabecera interna con buscador y aviso -->
        <div class="flex flex-col sm:flex-row justify-between items-center pb-3 border-b border-orange-100 gap-4">
            <div class="flex items-center space-x-2.5 w-full sm:w-auto">
                <div class="w-9 h-9 bg-orange-100 rounded-xl flex items-center justify-center text-orange-700 shadow-sm border border-orange-200 shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <h2 class="text-sm font-extrabold text-orange-950">Panel de Conexiones en Tiempo Real</h2>
                    <p class="text-[11px] text-orange-600 font-medium">Monitoreo de actividad de usuarios</p>
                </div>
            </div>
            
            <div class="w-full sm:w-72">
                <input type="text" id="buscador" oninput="filtrarTabla()" placeholder="Buscar usuario o UR..." class="w-full px-3.5 py-2 text-xs bg-orange-50/50 border border-orange-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-400 shadow-sm transition-all text-orange-950 placeholder-orange-300 font-medium">
            </div>
        </div>

        <!-- Tabla con scroll interno y cabecera fija idéntica al directorio -->
        <div class="conexion-tabla-contenedor overflow-y-auto border border-orange-200 rounded-xl relative bg-white">
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr class="bg-orange-900 text-white uppercase sticky top-0 z-20 shadow-sm border-b border-orange-800 text-[11px]">
                        <th class="p-3 bg-orange-900 text-white">Usuario (ID)</th>
                        <th class="p-3 bg-orange-900 text-white">Nombre / UR</th>
                        <th class="p-3 bg-orange-900 text-white text-center">Estado</th>
                        <th class="p-3 bg-orange-900 text-white text-right">Última Actividad</th>
                    </tr>
                </thead>
                <tbody id="tabla-conexiones" class="divide-y divide-orange-50 bg-white">
                    <tr><td colspan="4" class="p-6 text-center text-orange-400 font-medium animate-pulse">Cargando conexiones...</td></tr>
                </tbody>
            </table>
        </div>
        
        <div class="flex justify-between items-center pt-1">
            <span class="text-[11px] text-orange-800 font-medium bg-orange-50/80 px-3 py-1.5 rounded-lg border border-orange-200">
                💡 Los usuarios <span class="text-emerald-600 font-extrabold inline-flex items-center"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-1 ml-1"></span>En línea</span> aparecen automáticamente arriba.
            </span>
            <span class="text-[10px] text-orange-400 font-semibold uppercase tracking-widest">Servidor Activo</span>
        </div>

    </main>

    <script>
        let globalUsuarios = [];

        window.addEventListener('DOMContentLoaded', () => {
            cargarConexiones();
            // Consulta automática cada 5 segundos al servidor para actualizar estados en tiempo real
            setInterval(cargarConexiones, 5000);
        });

        async function cargarConexiones() {
            try {
                const res = await fetch('/api/admin/online-users');
                const data = await res.json();
                if (data.success && Array.isArray(data.users)) {
                    globalUsuarios = data.users;
                    renderizarTabla(globalUsuarios);
                }
            } catch (e) {
                console.error("Error al conectar con el servidor de conexiones:", e);
            }
        }

        function renderizarTabla(usuarios) {
            const tbody = document.getElementById('tabla-conexiones');
            if (!tbody) return;
            tbody.innerHTML = '';

            // Ordenar: Los que están en línea (isOnline: true) van primero automáticamente
            usuarios.sort((a, b) => (b.isOnline === a.isOnline) ? 0 : b.isOnline ? 1 : -1);

            if (usuarios.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-orange-400 font-medium">No hay usuarios registrados.</td></tr>`;
                return;
            }

            usuarios.forEach(u => {
                const tr = document.createElement('tr');
                tr.className = "conexion-fila-hover border-b border-orange-50 transition-colors";
                
                const estadoHtml = u.isOnline 
                    ? `<span class="px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-full text-[10px] font-extrabold border border-emerald-200 shadow-xs inline-flex items-center justify-center"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse mr-1"></span>En línea</span>` 
                    : `<span class="px-2.5 py-1 bg-slate-100 text-slate-500 rounded-full text-[10px] font-bold border border-slate-200 inline-flex items-center justify-center">Desconectado</span>`;

                tr.innerHTML = `
                    <td class="p-3 font-mono font-bold text-orange-700">${u.usuario}</td>
                    <td class="p-3">
                        <strong class="text-orange-950 block text-xs">${u.nombre || 'N/A'}</strong>
                        <span class="text-[10px] text-orange-600 uppercase font-bold tracking-wide">${u.ur || 'N/A'}</span>
                    </td>
                    <td class="p-3 text-center">${estadoHtml}</td>
                    <td class="p-3 text-right text-xs text-orange-600 font-medium">${u.lastActive}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarTabla() {
            const query = document.getElementById('buscador').value.toLowerCase().trim();
            const filtrados = globalUsuarios.filter(u => 
                (u.usuario && u.usuario.toLowerCase().includes(query)) ||
                (u.nombre && u.nombre.toLowerCase().includes(query)) ||
                (u.ur && u.ur.toLowerCase().includes(query))
            );
            renderizarTabla(filtrados);
        }
    </script>
</body>
</html>
