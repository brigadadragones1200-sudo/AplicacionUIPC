<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja de Eventos - UIPC Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #26619C; 
            margin: 0;
            background-image: radial-gradient(#1A457B 1px, transparent 1px);
            background-size: 20px 20px;
        }
        /* Estilos para el drag and drop */
        .drag-over {
            border-color: #10B981 !important;
            background-color: #ECFDF5 !important;
        }
    </style>
</head>
<body class="p-6 flex justify-center items-center w-full min-h-screen">

    <div class="w-full max-w-[900px] bg-white p-8 rounded-3xl shadow-2xl border-4 border-[#1A457B]">
        
        <!-- Encabezado -->
        <div class="flex flex-col sm:flex-row items-center gap-4 mb-6 border-b border-slate-200 pb-5 text-center sm:text-left">
            <div class="w-16 h-16 bg-[#26619C] rounded-2xl flex items-center justify-center text-white shadow-lg flex-shrink-0 border-2 border-[#1A457B]">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            </div>
            <div>
                <h1 class="text-3xl font-black text-slate-800 tracking-tight">Carga de Archivo de Eventos</h1>
                <p class="text-sm font-bold text-slate-500 mt-1">Sube un archivo <span class="text-[#26619C] bg-blue-50 px-2 py-0.5 rounded border border-blue-100">.txt</span> con los mensajes de WhatsApp para procesar y publicar en la agenda.</p>
            </div>
        </div>

        <!-- Formulario de Subida de Archivo -->
        <form id="formCajaEvento" onsubmit="subirArchivo(event)" class="space-y-6">
            
            <!-- Zona de Arrastrar y Soltar -->
            <div id="dropZone" class="w-full h-64 border-4 border-dashed border-slate-300 rounded-3xl bg-slate-50 hover:bg-slate-100 transition-all flex flex-col items-center justify-center cursor-pointer relative group">
                
                <input type="file" id="archivoTxt" accept=".txt" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" required onchange="actualizarNombreArchivo(this)">
                
                <div class="flex flex-col items-center justify-center p-6 text-center z-0 pointer-events-none">
                    <div id="iconoNube" class="bg-white p-4 rounded-full shadow-sm mb-4 border border-slate-200 group-hover:scale-110 transition-transform">
                        <svg class="w-10 h-10 text-[#26619C]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <p class="text-lg font-bold text-slate-700" id="textoPrincipalDrop">Arrastra aquí tu archivo .txt</p>
                    <p class="text-sm text-slate-500 mt-2" id="textoSecundarioDrop">O haz clic para explorar en tu equipo</p>
                </div>
            </div>

            <div id="alertaExito" class="hidden p-4 bg-emerald-50 text-emerald-800 text-sm font-bold rounded-xl border-2 border-emerald-200 flex items-center justify-center gap-2 transition-all shadow-sm">
                <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                ¡Archivo procesado y eventos publicados con éxito!
            </div>

            <div id="alertaError" class="hidden p-4 bg-rose-50 text-rose-800 text-sm font-bold rounded-xl border-2 border-rose-200 flex items-center justify-center gap-2 transition-all shadow-sm">
                <svg class="w-6 h-6 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span id="mensajeErrorText">Error al subir el archivo.</span>
            </div>

            <!-- Botones de Acción -->
            <div class="flex flex-col sm:flex-row gap-4 mt-6 pt-4 border-t border-slate-100">
                <button type="submit" id="btnProcesar" class="flex-1 bg-[#26619C] hover:bg-[#1A457B] text-white font-black py-4 text-lg rounded-2xl shadow-xl transition-all active:scale-95 flex justify-center items-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Procesar Archivo
                </button>
                
                <button type="button" onclick="borrarTodosLosDatos()" class="sm:w-auto bg-rose-100 hover:bg-rose-200 text-rose-700 font-black py-4 px-6 text-base rounded-2xl border-2 border-rose-300 transition-all active:scale-95 flex justify-center items-center gap-2 cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    Vaciar Muro
                </button>
            </div>
        </form>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('archivoTxt');
        const textoPrincipalDrop = document.getElementById('textoPrincipalDrop');
        const textoSecundarioDrop = document.getElementById('textoSecundarioDrop');
        const iconoNube = document.getElementById('iconoNube');

        // Efectos visuales drag & drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-over'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-over'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            fileInput.files = files; // Asignar archivos arrastrados al input
            actualizarNombreArchivo(fileInput);
        });

        function actualizarNombreArchivo(input) {
            if (input.files && input.files.length > 0) {
                const archivo = input.files[0];
                
                // Validar que sea txt
                if (archivo.type !== "text/plain" && !archivo.name.endsWith('.txt')) {
                    mostrarError("Por favor, selecciona un archivo de texto plano (.txt).");
                    input.value = ""; // Limpiar input
                    resetearZonaDrop();
                    return;
                }

                textoPrincipalDrop.innerHTML = `<span class="text-[#26619C]">${archivo.name}</span>`;
                textoSecundarioDrop.innerText = `Tamaño: ${(archivo.size / 1024).toFixed(2)} KB`;
                
                iconoNube.innerHTML = `<svg class="w-10 h-10 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                iconoNube.classList.replace('border-slate-200', 'border-emerald-200');
                iconoNube.classList.replace('bg-white', 'bg-emerald-50');
            } else {
                resetearZonaDrop();
            }
        }

        function resetearZonaDrop() {
            textoPrincipalDrop.innerText = "Arrastra aquí tu archivo .txt";
            textoSecundarioDrop.innerText = "O haz clic para explorar en tu equipo";
            iconoNube.innerHTML = `<svg class="w-10 h-10 text-[#26619C]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>`;
            iconoNube.classList.replace('border-emerald-200', 'border-slate-200');
            iconoNube.classList.replace('bg-emerald-50', 'bg-white');
        }

        function mostrarError(mensaje) {
            const alerta = document.getElementById('alertaError');
            document.getElementById('mensajeErrorText').innerText = mensaje;
            alerta.classList.remove('hidden');
            setTimeout(() => alerta.classList.add('hidden'), 5000);
        }

        async function subirArchivo(e) {
            e.preventDefault();
            
            if (!fileInput.files || fileInput.files.length === 0) {
                mostrarError("Debes seleccionar un archivo primero.");
                return;
            }

            const btn = document.getElementById('btnProcesar');
            const alertaExito = document.getElementById('alertaExito');
            document.getElementById('alertaError').classList.add('hidden');
            
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                Procesando en servidor...
            `;

            // Preparar FormData para enviar el archivo al backend
            const formData = new FormData();
            formData.append('archivo_eventos', fileInput.files[0]);

            try {
                // NOTA: Ajusta esta URL a la ruta de tu backend que recibe el archivo
                const response = await fetch('/api/eventos/upload', {
                    method: 'POST',
                    body: formData // No se envía Content-Type, el navegador lo calcula para FormData
                });

                if(response.ok) {
                    document.getElementById('formCajaEvento').reset();
                    resetearZonaDrop();
                    
                    alertaExito.classList.remove('hidden');
                    setTimeout(() => {
                        alertaExito.classList.add('hidden');
                    }, 5000);
                } else {
                    mostrarError("Error del servidor al procesar el archivo.");
                }
            } catch (error) {
                mostrarError("Error de conexión. Verifica que el servidor esté activo.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Procesar Archivo`;
            }
        }

        async function borrarTodosLosDatos() {
            if(!confirm("⚠️ ¿Estás seguro de que deseas VACIAR todo el muro de eventos? Esta acción eliminará los registros de la agenda.")) {
                return;
            }

            try {
                const response = await fetch('/api/eventos/borrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if(response.ok) {
                    alert("🗑️ ¡Muro vaciado con éxito!");
                } else {
                    alert("Error: No se pudieron borrar los datos del servidor.");
                }
            } catch (error) {
                alert("Error de conexión al intentar borrar los datos.");
            }
        }
    </script>
</body>
</html>
