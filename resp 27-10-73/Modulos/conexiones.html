<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Conexiones UIPC</title>
    <link rel="icon" type="image/png" href="logo_UIPC.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background: transparent;
            font-family: 'Inter', sans-serif; 
        }

        .conexion-tabla-contenedor {
            max-height: 500px; 
        }

        .conexion-main {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border: 2px solid #77af9c;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .conexion-fila-hover:hover {
            background-color: rgba(119, 175, 156, 0.1);
            transition: background-color 0.2s ease;
        }
    </style>
</head>
<body class="h-auto flex flex-col text-slate-800 p-2 m-0 space-y-4">

    <main class="max-w-7xl mx-auto w-full conexion-main">
        
        <div class="flex flex-col sm:flex-row justify-between items-center pb-3 border-b border-slate-200 gap-4">
            <div class="flex items-center space-x-2.5 w-full sm:w-auto">
                <div class="w-9 h-9 text-white rounded-xl flex items-center justify-center shadow-sm border border-[#77af9c] shrink-0" style="background-color: #77af9c;">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <h2 class="text-sm font-extrabold text-slate-900">Panel de Conexiones en Tiempo Real</h2>
                    <p class="text-[11px] text-slate-500 font-medium">Monitoreo de actividad de usuarios</p>
                </div>
            </div>
            
            <div class="w-full sm:w-72">
                <input type="text" id="buscador" oninput="filtrarTabla()" placeholder="Buscar usuario o UR..." class="w-full px-3.5 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#77af9c] shadow-sm transition-all text-slate-800 placeholder-slate-400 font-medium">
            </div>
        </div>

        <div class="conexion-tabla-contenedor overflow-y-auto border border-slate-200 rounded-xl relative bg-white">
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr class="text-white uppercase sticky top-0 z-20 shadow-sm border-b border-[#5e9381] text-[11px]" style="background-color: #77af9c;">
                        <th class="p-3 text-white" style="background-color: #77af9c;">Usuario (ID)</th>
                        <th class="p-3 text-white" style="background-color: #77af9c;">Nombre / UR</th>
                        <th class="p-3 text-white text-center" style="background-color: #77af9c;">Estado</th>
                        <th class="p-3 text-white text-right" style="background-color: #77af9c;">Fecha y Hora de Actividad</th>
                    </tr>
                </thead>
                <tbody id="tabla-conexiones" class="divide-y divide-slate-100 bg-white">
                    <tr><td colspan="4" class="p-6 text-center text-slate-400 font-medium animate-pulse">Cargando conexiones...</td></tr>
                </tbody>
            </table>
        </div>
        
        <div class="flex justify-between items-center pt-1">
            <span class="text-[11px] text-slate-700 font-medium bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">
                💡 Los usuarios <span class="text-emerald-600 font-extrabold inline-flex items-center"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-1 ml-1"></span>En línea</span> aparecen automáticamente arriba.
            </span>
            <span class="text-[10px] text-slate-400 font-semibold uppercase tracking-widest">Servidor Activo</span>
        </div>

    </main>

    <script>
        let globalUsuarios = [];

        window.addEventListener('DOMContentLoaded', () => {
            cargarConexiones();
            setInterval(cargarConexiones, 5000);
        });

        async function cargarConexiones() {
            try {
                const res = await fetch('/api/admin/online-users');
                const data = await res.json();
                if (data.success && Array.isArray(data.users)) {
                    globalUsuarios = data.users;
                    renderizarTabla(globalUsuarios);
                }
            } catch (e) {
                console.error("Error al conectar con el servidor de conexiones:", e);
            }
        }

        function obtenerFechaHoraReal(u) {
            let fecha = new Date();

            if (u.isOnline) {
                return fecha.toLocaleString('es-MX', {
                    timeZone: 'America/Mexico_City',
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                }) + ' (En línea)';
            }

            if (u.lastActiveTimestamp && !isNaN(u.lastActiveTimestamp)) {
                fecha = new Date(Number(u.lastActiveTimestamp));
            } else if (u.lastActive && !u.lastActive.includes('Hace') && !u.lastActive.includes('Desconectado')) {
                let parsed = Date.parse(u.lastActive);
                if (!isNaN(parsed)) fecha = new Date(parsed);
            } else {
                let match = u.lastActive ? u.lastActive.match(/(\d+)([smhd])/) : null;
                if (match) {
                    let cantidad = parseInt(match[1]);
                    let unidad = match[2];
                    let ms = cantidad * 1000;
                    if (unidad === 'm') ms = cantidad * 60 * 1000;
                    if (unidad === 'h') ms = cantidad * 60 * 60 * 1000;
                    if (unidad === 'd') ms = cantidad * 24 * 60 * 60 * 1000;
                    fecha = new Date(Date.now() - ms);
                } else {
                    return 'Sin actividad reciente';
                }
            }

            return fecha.toLocaleString('es-MX', {
                timeZone: 'America/Mexico_City',
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
        }

        function renderizarTabla(usuarios) {
            const tbody = document.getElementById('tabla-conexiones');
            if (!tbody) return;
            tbody.innerHTML = '';

            usuarios.sort((a, b) => (b.isOnline === a.isOnline) ? 0 : b.isOnline ? 1 : -1);

            if (usuarios.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400 font-medium">No hay usuarios registrados.</td></tr>`;
                return;
            }

            usuarios.forEach(u => {
                const tr = document.createElement('tr');
                tr.className = "conexion-fila-hover border-b border-slate-100 transition-colors";
                
                const estadoHtml = u.isOnline 
                    ? `<span class="px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-full text-[10px] font-extrabold border border-emerald-200 shadow-xs inline-flex items-center justify-center"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse mr-1"></span>En línea</span>` 
                    : `<span class="px-2.5 py-1 bg-slate-100 text-slate-500 rounded-full text-[10px] font-bold border border-slate-200 inline-flex items-center justify-center">Desconectado</span>`;

                const tiempoTexto = obtenerFechaHoraReal(u);

                tr.innerHTML = `
                    <td class="p-3 font-mono font-bold" style="color: #77af9c;">${u.usuario}</td>
                    <td class="p-3">
                        <strong class="text-slate-900 block text-xs">${u.nombre || 'N/A'}</strong>
                        <span class="text-[10px] uppercase font-bold tracking-wide" style="color: #77af9c;">${u.ur || 'N/A'}</span>
                    </td>
                    <td class="p-3 text-center">${estadoHtml}</td>
                    <td class="p-3 text-right text-xs text-slate-600 font-medium">${tiempoTexto}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarTabla() {
            const query = document.getElementById('buscador').value.toLowerCase().trim();
            const filtrados = globalUsuarios.filter(u => 
                (u.usuario && u.usuario.toLowerCase().includes(query)) ||
                (u.nombre && u.nombre.toLowerCase().includes(query)) ||
                (u.ur && u.ur.toLowerCase().includes(query))
            );
            renderizarTabla(filtrados);
        }
    </script>
</body>
</html>
