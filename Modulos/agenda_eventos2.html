<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Eventos - Centro SEP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f1f5f9; 
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .espiral-libreta {
            position: absolute;
            left: -12px;
            top: 0;
            bottom: 0;
            width: 24px;
            background-image: radial-gradient(circle at 12px 20px, #0f172a 4px, transparent 5px);
            background-size: 24px 40px;
            background-repeat: repeat-y;
        }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto">
        <!-- Encabezado de la Agenda -->
        <div class="bg-gradient-to-r from-[#1A457B] to-[#26619C] text-white p-6 rounded-3xl shadow-xl mb-8 border border-[#1A457B] flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center backdrop-blur-sm border border-white/20">
                    <svg class="w-8 h-8 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <div>
                    <h1 class="text-3xl font-black tracking-tight drop-shadow-md">Agenda de Eventos</h1>
                    <p class="text-sm text-blue-100 font-medium mt-1 opacity-90">Centro SEP Universidad 1200</p>
                </div>
            </div>
            
            <div class="flex flex-col items-end gap-2">
                <!-- Botón de Cerrar Ventana -->
                <button onclick="cerrarVentana()" class="bg-rose-600 hover:bg-rose-500 text-white font-black text-xs py-2 px-4 rounded-xl shadow transition-all cursor-pointer flex items-center gap-1.5 border border-rose-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                    Cerrar
                </button>

                <div class="text-right">
                    <p class="text-xs text-blue-200 font-bold uppercase tracking-widest mb-1">Día de Operación</p>
                    <div id="fechaHoy" class="bg-black/20 px-4 py-2 rounded-xl text-sm font-bold border border-white/10">
                        Cargando...
                    </div>
                </div>
                <button onclick="cargarAgenda()" class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-black text-xs py-2 px-4 rounded-xl shadow transition-all cursor-pointer">
                    Actualizar Muro
                </button>
            </div>
        </div>

        <!-- Muro de Eventos -->
        <div id="contenedorAgenda" class="space-y-6 relative ml-0 sm:ml-3">
            <div class="absolute left-6 top-0 bottom-0 w-1 bg-blue-200 rounded-full hidden sm:block"></div>

            <div id="mensajeVacio" class="text-center py-16 bg-white/80 backdrop-blur-sm rounded-3xl border border-slate-200 shadow-sm">
                <svg class="w-16 h-16 mx-auto text-slate-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <p class="text-lg font-bold text-slate-500">Agenda libre por el momento</p>
                <p class="text-sm text-slate-400 mt-1">No hay eventos registrados para el día de hoy.</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'America/Mexico_City' };
            const fechaStr = new Date().toLocaleDateString('es-MX', opciones);
            document.getElementById('fechaHoy').innerText = fechaStr.charAt(0).toUpperCase() + fechaStr.slice(1);
            
            cargarAgenda();
            setInterval(cargarAgenda, 15000);
        });

        function cerrarVentana() {
            try {
                // Intenta cerrar la pestaña/ventana si fue abierta por script
                window.close();
                // Si la ventana no se cierra (por restricciones del navegador), intenta notificar al padre o recargar/redireccionar
                setTimeout(() => {
                    if (!window.closed) {
                        // Si está dentro de un iframe o modal, puedes ajustar esta línea según convenga
                        window.location.href = 'adminMaster.html'; 
                    }
                }, 300);
            } catch (e) {
                console.error("No se pudo cerrar la ventana automáticamente", e);
            }
        }

        function extraerResumenEvento(textoBruto) {
            let lineas = textoBruto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            
            lineas = lineas.filter(l => !/\[\d{1,2}:\d{2}.*\]/i.test(l) && !/José Madrigal Ventura/i.test(l));

            let sede = "No especificada";
            let fecha = "No especificada";
            let horario = "No especificado";
            let tema = "No especificado";
            let asistentes = "No especificados";
            let ur = "No especificada";

            const regexSede = /(cubo|área|area|acceso|ala|bodega|auditorio|sala)/i;
            const lineaSedeEncontrada = lineas.find(l => regexSede.test(l));
            
            if (lineaSedeEncontrada) {
                sede = lineaSedeEncontrada;
            } else if (lineas.length > 0 && !lineas[0].toUpperCase().includes('FECHA:')) {
                sede = lineas[0];
            }

            lineas.forEach(linea => {
                const upper = linea.toUpperCase();
                
                if (upper.startsWith('FECHA:')) {
                    fecha = linea.replace(/^fecha:\s*/i, '');
                } else if (upper.startsWith('HORARIO:') || upper.startsWith('HORA:')) {
                    horario = linea.replace(/^(horario|hora):\s*/i, '');
                } else if (upper.startsWith('TEMA:')) {
                    tema = linea.replace(/^tema:\s*/i, '');
                } else if (upper.startsWith('ASISTENTES:') || upper.startsWith('PARTICIPANTES:') || upper.startsWith('ASISTENCIA PARA:') || upper.startsWith('ASISTENCIA:')) {
                    asistentes = linea.replace(/^(asistentes|participantes|asistencia para|asistencia):\s*/i, '');
                } else if (upper.startsWith('CARGO:') || upper.includes('UR') || upper.includes('DIRECCIÓN') || upper.includes('UNIDAD')) {
                    ur = linea;
                }
            });

            return `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <span class="block font-black text-[#1A457B] uppercase text-[11px] mb-1">📍 Sede / Ubicación</span>
                        <span class="text-slate-800 font-semibold">${sede}</span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <span class="block font-black text-[#1A457B] uppercase text-[11px] mb-1">📅 Fecha</span>
                        <span class="text-slate-800 font-semibold">${fecha}</span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <span class="block font-black text-[#1A457B] uppercase text-[11px] mb-1">⏰ Horario</span>
                        <span class="text-slate-800 font-semibold">${horario}</span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <span class="block font-black text-[#1A457B] uppercase text-[11px] mb-1">👥 Asistentes</span>
                        <span class="text-slate-800 font-semibold">${asistentes}</span>
                    </div>
                    <div class="sm:col-span-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <span class="block font-black text-[#1A457B] uppercase text-[11px] mb-1">📌 Tema del Evento</span>
                        <span class="text-slate-800 font-semibold">${tema}</span>
                    </div>
                    <div class="sm:col-span-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <span class="block font-black text-[#1A457B] uppercase text-[11px] mb-1">🏢 UR (Unidad Responsable)</span>
                        <span class="text-slate-800 font-semibold">${ur}</span>
                    </div>
                </div>
            `;
        }

        async function cargarAgenda() {
            const contenedor = document.getElementById('contenedorAgenda');
            const mensajeVacio = document.getElementById('mensajeVacio');
            
            try {
                const response = await fetch('/api/eventos');
                const data = await response.json();

                const tarjetasViejas = contenedor.querySelectorAll('.tarjeta-evento');
                tarjetasViejas.forEach(t => t.remove());

                if(data.eventos && data.eventos.length > 0) {
                    mensajeVacio.classList.add('hidden');
                    
                    data.eventos.reverse().forEach((evento, index) => {
                        const tarjeta = document.createElement('div');
                        tarjeta.className = 'tarjeta-evento relative ml-0 sm:ml-12 bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden';
                        
                        const colores = ['bg-amber-400', 'bg-emerald-500', 'bg-rose-500', 'bg-indigo-500'];
                        const colorPestana = colores[index % colores.length];

                        tarjeta.innerHTML = `
                            <div class="absolute -left-[54px] top-6 w-5 h-5 ${colorPestana} rounded-full border-4 border-[#f1f5f9] shadow-md hidden sm:block z-10"></div>
                            <div class="absolute top-0 bottom-0 left-0 w-3 ${colorPestana}"></div>
                            <div class="espiral-libreta"></div>

                            <div class="pl-8 p-6 sm:p-8">
                                <div class="flex justify-between items-start border-b border-slate-100 pb-3 mb-4">
                                    <div class="text-slate-400 font-bold text-xs uppercase tracking-widest flex items-center gap-1">
                                        🕒 Publicado a las: ${evento.hora_registro}
                                    </div>
                                    <div class="${colorPestana} bg-opacity-20 text-slate-800 text-xs font-black px-3 py-1 rounded-full border border-slate-200 uppercase">
                                        Evento ${data.eventos.length - index}
                                    </div>
                                </div>
                                <div class="leading-relaxed">
                                    ${extraerResumenEvento(evento.texto_completo)}
                                </div>
                            </div>
                        `;
                        contenedor.appendChild(tarjeta);
                    });
                } else {
                    mensajeVacio.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Error al sincronizar la agenda:", error);
            }
        }
    </script>
</body>
</html>
