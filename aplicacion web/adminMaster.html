<!DOCTYPE html>

<head>
    <script>
        (function() {
            try {
                const userStr = sessionStorage.getItem('uipc_current_user');
                if (!userStr) {
                    window.location.replace('loginuipc.html');
                    return;
                }
                const userObj = JSON.parse(userStr);
                // Validación estricta: Solo el coordinador.uipc puede acceder al panel maestro admin
                if (!userObj.usuario || userObj.usuario !== 'coordinador.uipc') {
                    alert('Acceso restringido. No cuenta con privilegios de super administrador.');
                    window.location.replace('dashboard_master.html');
                }
            } catch(e) {
                window.location.replace('loginuipc.html');
            }
        })();
    </script>

    <script>
        function enviarHeartbeat() {
            try {
                const userStr = sessionStorage.getItem('uipc_current_user');
                if (userStr) {
                    const userObj = JSON.parse(userStr);
                    if (userObj && userObj.usuario) {
                        fetch('/api/heartbeat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId: userObj.usuario })
                        }).catch(err => {});
                    }
                }
            } catch (e) {}
        }
        window.addEventListener('DOMContentLoaded', () => {
            enviarHeartbeat();
            setInterval(enviarHeartbeat, 10000); 
        });

            let eventoPendienteId = null;

window.addEventListener('DOMContentLoaded', () => {
    verificarNuevoEventoUsuario();
});

async function verificarNuevoEventoUsuario() {
    try {
        const response = await fetch('/api/actividades');
        const data = await response.json();
        const acts = Array.isArray(data) ? data : (data.activities || []);
        
        if (acts.length === 0) return;

        acts.sort((a, b) => Number(b.id || 0) - Number(a.id || 0));
        const masReciente = acts[0];

        const ultimoVisto = localStorage.getItem('uipc_ultimo_evento_visto');

        if (ultimoVisto !== String(masReciente.id)) {
            eventoPendienteId = masReciente.id;
            document.getElementById('modalEventoTexto').innerHTML = `<b>${masReciente.titulo}</b><br><span class="text-slate-400 text-[11px]">Fecha: ${masReciente.fecha} | Sede: ${masReciente.sede}</span>`;
            document.getElementById('modalNuevoEvento').classList.remove('hidden');
        }
    } catch (e) {
        console.error("Error al comprobar nuevos eventos:", e);
    }
}

function cerrarModalEvento() {
    if (eventoPendienteId) {
        localStorage.setItem('uipc_ultimo_evento_visto', eventoPendienteId);
    }
    document.getElementById('modalNuevoEvento').classList.add('hidden');
}

function irAlCalendario() {
    if (eventoPendienteId) {
        localStorage.setItem('uipc_ultimo_evento_visto', eventoPendienteId);
    }
    window.location.href = 'calendario_actividades.html';
} 


    </script>
    <!-- VENTANA FLOTANTE DE NUEVO EVENTO -->
