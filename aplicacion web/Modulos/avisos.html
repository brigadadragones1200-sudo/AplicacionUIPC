<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso Asistencia UIPC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f4f6f5;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            height: 75px;
            overflow: hidden;
            border-bottom: 2px solid #77af9c;
        }

        .btn-asistencia {
            background: linear-gradient(to right, #77af9c, #9baec8);
            color: white;
            font-weight: 900;
            font-size: 15px;
            padding: 10px 25px;
            border-radius: 9999px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease-in-out;
            letter-spacing: 0.5px;
            border: 1px solid #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .btn-asistencia:hover {
            background: linear-gradient(to right, #5e9381, #889cb7);
            transform: scale(1.03);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }

        .icono-container {
            transition: transform 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .icono-container:hover {
            transform: scale(1.1);
        }

        .linea-registro {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: repeating-linear-gradient(
                45deg,
                #77af9c,
                #77af9c 10px,
                #9baec8 10px,
                #9baec8 20px
            );
        }
    </style>
</head>
<body class="relative flex items-center justify-center px-6 gap-6">

    <!-- Icono Izquierdo: Checklist -->
    <a href="Modulos/pase_lista.html" title="Registrar Asistencia" class="icono-container text-slate-800 w-1/6">
        <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="48" stroke="#77af9c" stroke-width="4" fill="#ffffff"/>
            <rect x="30" y="25" width="40" height="50" rx="4" stroke="#77af9c" stroke-width="4" fill="#f4f6f5"/>
            <path d="M40 25 V20 C40 17 43 15 46 15 H54 C57 15 60 17 60 20 V25" stroke="#77af9c" stroke-width="4" fill="none"/>
            <!-- Marcas de verificación -->
            <path d="M38 40 L45 47 L62 30" stroke="#77af9c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M38 60 L45 67 L62 50" stroke="#77af9c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="text-[9px] font-bold mt-0.5 text-slate-700 uppercase tracking-wider">ASISTENCIA</span>
    </a>

    <!-- Sección Central: Botón -->
    <div class="w-4/6 flex justify-center">
        <a href="Modulos/pase_lista.html" class="btn-asistencia text-center no-underline">
            NO OLVIDES REGISTRAR TU ASISTENCIA
        </a>
    </div>

    <!-- Icono Derecho: Checklist -->
    <a href="Modulos/pase_lista.html" title="Registrar Asistencia" class="icono-container text-slate-800 w-1/6">
        <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="48" stroke="#77af9c" stroke-width="4" fill="#ffffff"/>
            <rect x="30" y="25" width="40" height="50" rx="4" stroke="#77af9c" stroke-width="4" fill="#f4f6f5"/>
            <path d="M40 25 V20 C40 17 43 15 46 15 H54 C57 15 60 17 60 20 V25" stroke="#77af9c" stroke-width="4" fill="none"/>
            <!-- Marcas de verificación -->
            <path d="M38 40 L45 47 L62 30" stroke="#77af9c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M38 60 L45 67 L62 50" stroke="#77af9c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="text-[9px] font-bold mt-0.5 text-slate-700 uppercase tracking-wider">LISTA</span>
    </a>

    <!-- Barra decorativa inferior -->
    <div class="linea-registro"></div>

</body>
</html>
