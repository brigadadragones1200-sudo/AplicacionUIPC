<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Atención Prehospitalaria (FRAPC) - UIPC</title>
    <link rel="icon" type="image/png" href="logo_UIPC.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { 
            background: transparent !important;
            font-family: 'Inter', sans-serif; 
        }
    </style>
</head>
<body class="min-h-[auto] flex flex-col justify-center text-slate-800 p-2 m-0 bg-transparent">

    <main class="max-w-7xl mx-auto w-full space-y-4">
        
        <!-- Contenedor Principal con Borde Institucional y Fondo Blanco Limpio -->
        <div class="bg-white text-slate-800 px-6 py-4 rounded-2xl shadow-lg border-2 border-[#77af9c] flex flex-col sm:flex-row items-center justify-between relative overflow-hidden gap-4">
            
            <!-- Ilustración decorativa de fondo con tono rojo sutil -->
            <div class="absolute right-0 bottom-0 top-0 w-64 opacity-5 pointer-events-none flex items-center justify-end pr-6">
                <svg class="w-full h-full text-red-600" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
                </svg>
            </div>

            <!-- Contenido Izquierdo: Icono Rojo, Título y Descripción -->
            <div class="flex items-center space-x-4 relative z-10">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center overflow-hidden shadow-sm p-1 border-2 border-red-500 flex-shrink-0 bg-red-600">
                    <img src="logo_UIPC.png" alt="Logo UIPC" class="w-full h-full object-contain filter brightness-200" crossorigin="anonymous" onerror="this.src='https://placehold.co/40x40/dc2626/ffffff?text=UIPC'">
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h2 class="text-xs sm:text-sm font-black text-slate-900 tracking-tight">Atención Prehospitalaria</h2>
                        <span class="px-2 py-0.5 text-white rounded-full text-[9px] font-extrabold uppercase tracking-wider bg-red-600">FRAPC</span>
                    </div>
                    <p class="text-[11px] text-slate-500 leading-tight mt-0.5">
                        Registro oficial de primer contacto, signos vitales y emergencias.
                    </p>
                </div>
            </div>

            <!-- Botones Derechos (Actualizar y Capturar) -->
            <div class="relative z-10 w-full sm:w-auto flex-shrink-0 flex items-center gap-2">
                <button onclick="cargarFrapcs()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 px-4 rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 cursor-pointer border border-slate-300">
                    🔄 Actualizar
                </button>
                <a href="formato_frapc.html" target="_blank" rel="noopener noreferrer" class="w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white font-black py-2.5 px-6 rounded-xl text-xs shadow-md transition-all flex items-center justify-center space-x-2 cursor-pointer border border-red-500">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    <span class="tracking-wide uppercase font-black">Capturar FRAPC</span>
                </a>
            </div>

        </div>

        <!-- Sección de Registros FRAPC Recientes -->
        <div class="bg-white text-slate-800 p-6 rounded-2xl shadow-lg border-2 border-[#77af9c]">
            <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
                <h3 class="text-xs sm:text-sm font-black text-slate-900 uppercase tracking-wider flex items-center gap-2">
                    📋 Registros FRAPC Recientes en el Sistema
                </h3>
                <span id="contadorFrapcs" class="bg-red-100 text-red-700 text-[10px] font-black px-2.5 py-1 rounded-full uppercase">
                    Cargando...
                </span>
            </div>

            <!-- Contenedor Dinámico de la Lista de FRAPCs -->
            <div id="contenedorFrapcs" class="space-y-3 max-h-96 overflow-y-auto pr-1">
                <div class="text-center py-8 text-slate-400 text-xs font-medium">
                    Sincronizando registros FRAPC...
                </div>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarFrapcs();
            setInterval(cargarFrapcs, 15000); // Sincronización automática cada 15 segundos
        });

        function verificarEsAdmin() {
            try {
                // Busca los datos de usuario en sessionStorage o localStorage (incluyendo el marco padre)
                const userStr = sessionStorage.getItem('uipc_current_user') || 
                                (window.parent && window.parent.sessionStorage ? window.parent.sessionStorage.getItem('uipc_current_user') : null) || 
                                localStorage.getItem('uipc_current_user');

                if (userStr) {
                    const userObj = JSON.parse(userStr);
                    const rol = (userObj.rol || userObj.tipo || '').toLowerCase();
                    const usr = (userObj.usuario || '').toLowerCase();
                    
                    // Identificadores de Administrador
                    const esAdminRol = rol.includes('admin') || rol.includes('maestro') || rol.includes('coordinador');
                    const esUsuarioAdmin = usr === 'admin' || usr === 'daniel.gonzalez' || usr === 'daniel.gonzalez@nube.sep.gob.mx';
                    
                    return esAdminRol || esUsuarioAdmin || userObj.esAdmin === true;
                }
            } catch (e) {
                console.error("Error al validar rol de administrador:", e);
            }
            return false;
        }

        async function cargarFrapcs() {
            const contenedor = document.getElementById('contenedorFrapcs');
            const contador = document.getElementById('contadorFrapcs');
            const esAdmin = verificarEsAdmin();

            try {
                const response = await fetch('/api/frapcs');
                const data = await response.json();

                const listaFrapcs = data.frapcs || [];
                contador.innerText = `${listaFrapcs.length} Registros`;

                if (listaFrapcs.length === 0) {
                    contenedor.innerHTML = `
                        <div class="text-center py-8 text-slate-400 text-xs font-medium">
                            No hay formatos FRAPC registrados en la carpeta por el momento.
                        </div>
                    `;
                    return;
                }

                contenedor.innerHTML = '';

                // Muestra los archivos más recientes primero
                listaFrapcs.slice().reverse().forEach((frapc) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'bg-slate-50 hover:bg-slate-100/80 p-4 rounded-xl border border-slate-200 transition-all flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3';

                    // Si es Administrador genera el botón, si es usuario normal lo omite
                    const botonVisualizarHtml = esAdmin ? `
                        <a href="${frapc.url}" target="_blank" class="bg-white hover:bg-red-50 text-red-600 hover:text-red-700 font-black text-xs py-2 px-4 rounded-xl shadow-sm transition-all border border-red-200 flex items-center gap-1.5 cursor-pointer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Visualizar
                        </a>
                    ` : '';

                    itemDiv.innerHTML = `
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="bg-red-600 text-white text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider">FRAPC</span>
                                <span class="text-xs font-bold text-slate-800">${frapc.folio}</span>
                            </div>
                            <p class="text-[11px] text-slate-500 font-medium">
                                🕒 Actualizado: ${frapc.fecha}
                            </p>
                        </div>
                        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                            ${botonVisualizarHtml}
                        </div>
                    `;
                    contenedor.appendChild(itemDiv);
                });

            } catch (error) {
                console.error("Error al cargar los registros FRAPC:", error);
                contenedor.innerHTML = `
                    <div class="text-center py-8 text-rose-500 text-xs font-medium">
                        Error al synchronizar con el servidor de registros FRAPC.
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
