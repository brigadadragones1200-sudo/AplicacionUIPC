<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Consulta del Calendario Institucional UIPC</title>
    <link rel="icon" type="image/png" href="images/logo_UIPC.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: transparent;
            font-family: 'Inter', sans-serif; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-start text-slate-800 p-2 sm:p-4 space-y-3">

    <header class="bg-[#e2dece] text-slate-900 p-3 sm:p-4 rounded-xl shadow-md border border-slate-300 flex flex-col sm:flex-row justify-between items-center gap-3">
        <div class="flex items-center space-x-2">
            <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center overflow-hidden shadow-sm p-1 border-2 border-[#77af9c]">
                <img src="../images/logo_UIPC.png" alt="Logo UIPC" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/40x40/1e3a8a/ffffff?text=UIPC'">
            </div>
            <div>
                <h1 class="text-sm sm:text-base font-black text-slate-900 tracking-tight">Calendario Institucional UIPC</h1>
                <p class="text-[11px] text-slate-600 font-semibold">Visualización en tiempo real.</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 flex-wrap gap-1">
            <span class="px-2 py-0.5 bg-emerald-100 border border-emerald-400 text-emerald-800 rounded-full text-[10px] font-bold flex items-center">
                <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full mr-1 animate-ping"></span> En vivo
            </span>
            <a href="calendario_actividades.html" target="_blank" rel="noopener noreferrer" style="background-color: #77af9c;" class="hover:bg-[#5e9381] text-white font-extrabold px-3 py-1.5 rounded-lg text-[11px] shadow-sm transition-all cursor-pointer flex items-center space-x-1 border border-[#5e9381]">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span>Ver Calendario</span>
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full">
        <div class="bg-white text-slate-800 p-4 rounded-xl shadow-md border-2 border-[#77af9c] flex flex-col space-y-3">
            <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                <h2 class="text-xs sm:text-sm font-extrabold text-slate-900 flex items-center uppercase tracking-wide">
                    <svg class="w-4 h-4 mr-1.5 text-[#77af9c]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    Listado de Actividades
                </h2>
                <span id="actCountBadge" class="text-[10px] bg-[#f4f6f5] text-slate-700 border border-slate-300 font-bold px-2.5 py-0.5 rounded-full">0 registrados</span>
            </div>

            <!-- Contenedor con altura fija para mostrar exactamente 3 filas y activar scroll vertical -->
            <div class="overflow-y-auto max-h-[255px] border border-slate-300 rounded-lg relative bg-white text-slate-800 shadow-inner">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="text-white uppercase sticky top-0 z-20 shadow-sm border-b border-slate-300 text-[11px]" style="background-color: #77af9c;">
                            <th class="p-2.5 text-white">FECHA / SEDE</th>
                            <th class="p-2.5 text-white">EVENTO / DETALLES</th>
                            <th class="p-2.5 text-white text-center">AVISO</th>
                            <th class="p-2.5 text-white text-center">ACCIÓN</th>
                        </tr>
                    </thead>
                    <tbody id="activitiesTableBody" class="divide-y divide-slate-100 text-xs">
                        <tr><td colspan="4" class="p-4 text-center text-slate-400">Cargando actividades...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Detalles -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900 bg-opacity-60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md p-5 rounded-xl shadow-2xl space-y-3 border-2 border-[#77af9c]">
            <h3 id="modalTitle" class="text-sm font-black text-slate-900 border-b border-slate-200 pb-2">Detalles del Evento</h3>
            <p id="modalBody" class="text-xs text-slate-700 whitespace-pre-line leading-relaxed bg-[#f4f6f5] p-3 rounded-lg border border-slate-200 font-medium"></p>
            <div class="flex justify-end pt-1">
                <button onclick="closeDetailModal()" style="background-color: #77af9c;" class="hover:bg-[#5e9381] text-white px-5 py-1.5 rounded-lg text-xs font-bold cursor-pointer shadow-sm">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Modal Calendario -->
    <div id="calendarModal" class="fixed inset-0 bg-slate-900 bg-opacity-75 hidden flex items-center justify-center p-2 z-50">
        <div class="bg-white w-full max-w-4xl h-[85vh] rounded-xl shadow-2xl flex flex-col overflow-hidden border-2 border-[#77af9c]">
            <div style="background-color: #77af9c;" class="text-white p-3 flex justify-between items-center shadow-md">
                <div class="flex items-center space-x-2">
                    <svg class="w-5 h-5 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <h3 class="text-sm font-bold">Calendario Institucional UIPC</h3>
                </div>
                <button onclick="closeCalendarModal()" class="text-white hover:text-red-200 font-bold text-2xl cursor-pointer">&times;</button>
            </div>
            <div class="bg-[#f4f6f5] border-b border-slate-200 px-4 py-2 flex justify-between items-center">
                <button onclick="changeMonth(-1)" class="p-1.5 bg-white hover:bg-slate-100 border border-slate-300 rounded text-slate-800 font-bold text-xs cursor-pointer shadow-xs">&larr; Mes Anterior</button>
                <h2 id="calendarMonthTitle" class="text-xs font-extrabold text-slate-900 uppercase tracking-wide">Cargando mes...</h2>
                <button onclick="changeMonth(1)" class="p-1.5 bg-white hover:bg-slate-100 border border-slate-300 rounded text-slate-800 font-bold text-xs cursor-pointer shadow-xs">Mes Siguiente &rarr;</button>
            </div>
            <div class="flex-grow bg-slate-50 p-3 overflow-y-auto flex flex-col">
                <div class="grid grid-cols-7 gap-1.5 text-center font-bold text-[11px] text-slate-700 mb-1">
                    <div class="py-1 bg-slate-200 rounded">Dom</div><div class="py-1 bg-slate-200 rounded">Lun</div><div class="py-1 bg-slate-200 rounded">Mar</div><div class="py-1 bg-slate-200 rounded">Mié</div><div class="py-1 bg-slate-200 rounded">Jue</div><div class="py-1 bg-slate-200 rounded">Vie</div><div class="py-1 bg-slate-200 rounded">Sáb</div>
                </div>
                <div id="calendarGrid" class="grid grid-cols-7 gap-1.5 flex-grow auto-rows-fr"></div>
            </div>
            <div class="bg-white p-2.5 border-t border-slate-200 text-right">
                <button onclick="closeCalendarModal()" style="background-color: #77af9c;" class="hover:bg-[#5e9381] text-white font-bold py-1.5 px-5 rounded-lg text-xs cursor-pointer shadow-sm">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let globalActivities = [];
        let viewDate = new Date();

        window.addEventListener('DOMContentLoaded', () => {
            const userStr = sessionStorage.getItem('uipc_current_user');
            currentUser = userStr ? JSON.parse(userStr) : { usuario: 'invitado', nombre: 'Usuario General' };
            loadActivities();
            setInterval(loadActivities, 5000);
        });

        function formatDateToDMY(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateStr;
        }

        async function loadActivities() {
            const tbody = document.getElementById('activitiesTableBody');
            const badge = document.getElementById('actCountBadge');
            if (!tbody) return;
            try {
                const res = await fetch('/api/actividades');
                const data = await res.json();
                const acts = Array.isArray(data) ? data : (data.activities || []);
                acts.sort((a, b) => Number(b.id || 0) - Number(a.id || 0));
                globalActivities = acts;
                badge.innerText = `${acts.length} registrados`;

                if (acts.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">No hay actividades registradas.</td></tr>`;
                    return;
                }

                const viewedKey = `uipc_viewed_activities_${currentUser.usuario}`;
                let viewedIds = JSON.parse(localStorage.getItem(viewedKey) || '[]');
                tbody.innerHTML = '';

                acts.forEach(act => {
                    const isViewed = viewedIds.includes(String(act.id));
                    
                    const fInicio = formatDateToDMY(act.fecha);
                    const fFin = act.fechaFin ? formatDateToDMY(act.fechaFin) : fInicio;
                    const dateText = fFin && fFin !== fInicio ? `${fInicio} al ${fFin}` : fInicio;
                    
                    const badgeHtml = isViewed 
                        ? `<span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full text-[9px] font-bold border border-slate-200 whitespace-nowrap">VISTO</span>`
                        : `<span class="px-2 py-0.5 bg-gradient-to-r from-amber-500 to-red-600 text-white rounded-full text-[9px] font-extrabold shadow-xs animate-pulse whitespace-nowrap">NUEVO</span>`;

                    const tr = document.createElement('tr');
                    
                    if (act.esCapacitacion) {
                        tr.className = "bg-orange-50 hover:bg-orange-100 transition-colors border-b border-orange-100 last:border-none";
                    } else {
                        tr.className = "hover:bg-slate-50 transition-colors border-b border-slate-100 last:border-none";
                    }

                    tr.innerHTML = `
                        <td class="p-2.5">
                            <div style="border-left: 6px solid #77af9c;" class="bg-[#f4f6f5] border border-slate-200 rounded-r-lg px-3 py-1.5 shadow-xs space-y-0.5">
                                <div class="text-xs font-mono text-slate-900 font-black tracking-tight">${dateText}</div>
                                <div class="text-[10px] text-slate-600 font-bold uppercase truncate max-w-[130px]" title="${act.sede}">SEDE: ${act.sede || act.mes}</div>
                            </div>
                        </td>
                        <td class="p-2.5">
                            <strong class="text-slate-900 text-[11px] font-black">${act.titulo}</strong><br>
                            <span class="text-[10px] text-slate-700 font-semibold">${act.hora}</span> <span class="text-[9px] text-slate-500 font-medium">[${act.modalidad || 'Presencial'}]</span>
                        </td>
                        <td class="p-2.5 text-center">${badgeHtml}</td>
                        <td class="p-2.5 text-center">
                            <button onclick="viewActivity('${act.id}')" style="background-color: #77af9c;" class="hover:bg-[#5e9381] text-white px-3 py-1 rounded text-[11px] font-bold cursor-pointer transition-all shadow-xs">Ver</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">Error al cargar actividades.</td></tr>`;
            }
        }

        function viewActivity(id) {
            const act = globalActivities.find(a => String(a.id) === String(id));
            if (!act) return;
            const viewedKey = `uipc_viewed_activities_${currentUser.usuario}`;
            let viewedIds = JSON.parse(localStorage.getItem(viewedKey) || '[]');
            if (!viewedIds.includes(String(id))) {
                viewedIds.push(String(id));
                localStorage.setItem(viewedKey, JSON.stringify(viewedIds));
                loadActivities();
            }
            const fInicio = formatDateToDMY(act.fecha);
            const fFin = act.fechaFin ? formatDateToDMY(act.fechaFin) : fInicio;
            const dateText = fFin && fFin !== fInicio ? `${fInicio} al ${fFin}` : fInicio;

            document.getElementById('modalTitle').innerText = `📋 ${act.titulo}`;
            document.getElementById('modalBody').innerText = `🕒 Horario: ${act.hora}\n📅 Fecha: ${dateText}\n📍 Sede: ${act.sede || 'N/A'}\n💻 Modalidad: ${act.modalidad || 'Presencial'}\n\n${act.descripcion || 'Sin observaciones adicionales.'}`;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); }
        function openCalendarModal() { viewDate = new Date(); document.getElementById('calendarModal').classList.remove('hidden'); renderCalendarGrid(); }
        function closeCalendarModal() { document.getElementById('calendarModal').classList.add('hidden'); }
        function changeMonth(direction) { viewDate.setDate(1); viewDate.setMonth(viewDate.getMonth() + direction); renderCalendarGrid(); }

        function renderCalendarGrid() {
            const gridContainer = document.getElementById('calendarGrid');
            const titleEl = document.getElementById('calendarMonthTitle');
            const year = viewDate.getFullYear(); const month = viewDate.getMonth();
            const monthsNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            titleEl.innerText = `${monthsNames[month]} ${year}`;
            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevTotalDays = new Date(year, month, 0).getDate();
            gridContainer.innerHTML = '';
            for (let i = firstDayIndex; i > 0; i--) { gridContainer.appendChild(createDayCell(prevTotalDays - i + 1, true)); }
            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayActs = globalActivities.filter(a => {
                    const fInicio = a.fecha;
                    const fFin = a.fechaFin || a.fecha;
                    return dateStr >= fInicio && dateStr <= fFin;
                });
                gridContainer.appendChild(createDayCell(day, false, dayActs));
            }
            const totalCells = firstDayIndex + totalDays;
            const remaining = totalCells <= 35 ? 35 - totalCells : 42 - totalCells;
            for (let i = 1; i <= remaining; i++) { gridContainer.appendChild(createDayCell(i, true)); }
        }

        function createDayCell(dayNum, isInactive, acts = []) {
            const hasEvent = acts.length > 0;
            const cell = document.createElement('div');
            
            let bgClass = isInactive ? 'opacity-40 bg-slate-50' : 'bg-white';
            if (!isInactive && hasEvent) {
                const tieneCurso = acts.some(a => a.esCapacitacion);
                bgClass = tieneCurso ? 'bg-orange-100 border-orange-300 shadow-xs' : 'bg-emerald-100 border-emerald-300 shadow-xs';
            }

            cell.className = `border rounded-lg p-1.5 flex flex-col justify-start min-h-[75px] overflow-hidden ${bgClass}`;
            
            const num = document.createElement('span'); 
            num.className = `text-[11px] font-black mb-0.5 ${isInactive ? 'text-slate-400' : 'text-slate-900'}`; 
            num.innerText = dayNum; 
            cell.appendChild(num);

            const content = document.createElement('div'); content.className = "space-y-0.5 overflow-y-auto";
            if (hasEvent) {
                acts.forEach(act => {
                    const badge = document.createElement('div');
                    const badgeStyle = act.esCapacitacion 
                        ? 'bg-orange-500 border-orange-600 text-white font-extrabold' 
                        : 'bg-[#77af9c] border-[#5e9381] text-white font-extrabold';

                    badge.className = `p-0.5 border rounded text-[8px] truncate cursor-pointer transition-colors shadow-xs ${badgeStyle}`;
                    badge.title = act.titulo; 
                    badge.innerHTML = act.titulo;
                    badge.onclick = () => viewActivity(act.id);
                    content.appendChild(badge);
                });
            }
            cell.appendChild(content); return cell;
        }
    </script>
</body>
</html>
