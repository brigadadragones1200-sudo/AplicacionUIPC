<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pase de Lista - Checador UIPC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background-image: url('fdo2uipc.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif; 
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .checador-main {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 24px;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body class="h-auto flex flex-col text-slate-900 p-4 m-0 space-y-4">

    <main class="max-w-7xl mx-auto w-full checador-main space-y-6">
        
        <!-- Cabecera con Buscador y Botón Cerrar -->
        <div class="flex flex-col md:flex-row justify-between items-center pb-4 border-b border-slate-200 gap-4">
            <div class="flex items-center space-x-3 w-full md:w-auto">
                <div class="w-10 h-10 bg-blue-900 text-white rounded-xl flex items-center justify-center shadow-sm border border-blue-200 shrink-0">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012-2m-6 9l2 2 4-4"></path></svg>
                </div>
                <div>
                    <h2 class="text-base font-extrabold text-blue-950">Panel General de Asistencia y Checador - UIPC</h2>
                    <p class="text-xs text-slate-500">Sincronización en tiempo real vía servidor</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="w-full sm:w-72">
                    <input type="text" id="buscadorPersonal" oninput="filtrarLista()" placeholder="Buscar por nombre, UR o indicativo..." class="w-full px-4 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm font-medium">
                </div>
                <button onclick="window.close()" class="px-4 py-2 bg-red-600 hover:bg-slate-600 text-white rounded-xl text-xs font-bold shadow-sm transition-all flex items-center gap-1.5 cursor-pointer shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    <span>Cerrar</span>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-5 gap-3 text-xs font-bold">
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex justify-between items-center">
                <span class="text-slate-600">Total Plantilla:</span>
                <span id="stat-total" class="text-slate-900 text-sm">0</span>
            </div>
            <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-200 flex justify-between items-center">
                <span class="text-emerald-700">En el Inmueble:</span>
                <span id="stat-inmueble" class="text-emerald-800 text-sm">0</span>
            </div>
            <div class="bg-blue-50 p-3 rounded-xl border border-blue-200 flex justify-between items-center">
                <span class="text-blue-700">En Casa:</span>
                <span id="stat-casa" class="text-blue-800 text-sm">0</span>
            </div>
            <div class="bg-amber-50 p-3 rounded-xl border border-amber-200 flex justify-between items-center">
                <span class="text-amber-700">En Comisión:</span>
                <span id="stat-comision" class="text-amber-800 text-sm">0</span>
            </div>
            <div class="bg-red-50 p-3 rounded-xl border border-red-200 flex justify-between items-center">
                <span class="text-red-700">Sin Registrar:</span>
                <span id="stat-sin" class="text-red-800 text-sm">0</span>
            </div>
        </div>

        <div class="overflow-y-auto max-h-[500px] border border-slate-200 rounded-xl bg-white">
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr class="bg-slate-900 text-white uppercase sticky top-0 z-20 shadow-sm border-b border-slate-800 text-[11px]">
                        <th class="p-3">Personal / UR</th>
                        <th class="p-3">Cargo e Indicativo</th>
                        <th class="p-3 text-center">Hora de Registro</th>
                        <th class="p-3">Estatus y Observaciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-asistencia" class="divide-y divide-slate-100">
                    <tr><td colspan="4" class="p-6 text-center text-slate-400 font-medium animate-pulse">Cargando base de datos del servidor...</td></tr>
                </tbody>
            </table>
        </div>

    </main>

    <script>
        let baseUsuarios = [
            { usuario: "ivan.vela", nombre: "Ivän Vela Cárdenas", ur: "DGAIR", cargo: "Enlace de Protección Civil" },
            { usuario: "daniel.gonzalez", nombre: "Daniel Gonzalez Pacheco", ur: "DGDYSNEM", cargo: "Coordinador Operativo UIPC", indicativo: "DELTA" },
            { usuario: "oscar.mondragon", nombre: "Oscar Mondragón Pineda", ur: "DGFCDD", cargo: "Enlace de PC", indicativo: "Capricornio" },
            { usuario: "ludwing.gutierrez", nombre: "Ludwing Ivan Gutierrez Romero", ur: "DGBTD", cargo: "Enlace de PC", indicativo: "Diablo" },
            { usuario: "coordinador.uipc", nombre: "Administrador Coordinador Operativo", ur: "UIPC", cargo: "Coordinador Operativo" },
            { usuario: "eduardo.banuelos", nombre: "Jesús Eduardo Bañuelos Prieto", ur: "DGDySNEM", cargo: "Enlace de PC" },
            { usuario: "sujei.alonso", nombre: "Sujei alonso Aguillón", ur: "DGDYSNEM", cargo: "Jefe de Brigada (Comunicación)", indicativo: "Libélula" },
            { usuario: "flor.real", nombre: "Flor Gabriela Real Galicia", ur: "DGDCYPEI", cargo: "Enlace de PC", indicativo: "GAMA" },
            { usuario: "julio.bautista", nombre: "Julio Bautista Flores", ur: "DGME", cargo: "Enlace de PC" },
            { usuario: "reyes.guerrero", nombre: "J. Reyes Guerrero Sánchez", ur: "SEB", cargo: "Enlace de PC", indicativo: "GUERRERO" },
            { usuario: "genaro.bautista", nombre: "Genaro Bautista Garcia", ur: "DGGEYET", cargo: "Enlace de PC", indicativo: "BARRACUDA" },
            { usuario: "alberto.garcia", nombre: "Lic. Alberto García Rubio", ur: "DGEIIB", cargo: "Enlace de PC" },
            { usuario: "ezequiel.badillo", nombre: "C. Ezequiel Badillo Pérez", ur: "DGCFT", cargo: "Enlace de PC y Coordinador", indicativo: "ALFA" },
            { usuario: "sonia.zermeño", nombre: "Sonia Zermeño Guzmán", ur: "TecNM", cargo: "Enlace de PC" },
            { usuario: "joel.espinosa", nombre: "Joel Adalberto Espinosa Flores", ur: "DGPPYEE", cargo: "ENLACEPC" },
            { usuario: "maria.eugenia", nombre: "María Eugenia Ibarra Cazares", ur: "USICAMM", cargo: "Suplente jefe de piso", indicativo: "VIRGO" },
            { usuario: "juan.paz", nombre: "Juan Ramón Paz Bond", ur: "USICAMM", cargo: "Enlace de PC", indicativo: "BOND" },
            { usuario: "jose.madrigal", nombre: "José Madrigal Ventura", ur: "SUBDIRECCIÓN DE PC SEP", cargo: "Subdirector", indicativo: "FOX" },
            { usuario: "maria.nieves", nombre: "C. María Cristina Nieves Vega", ur: "SEMS", cargo: "Enlace de PC", indicativo: "NIEVES" },
            { usuario: "alejandro.cabanez", nombre: "Héctor Alejandro Cabañez Hernández", ur: "DGRHO", cargo: "Enlace de PC" },
            { usuario: "americo.rios", nombre: "Lic. Rafael Américo Rios Olivares", ur: "DGDySNEM", cargo: "Suplente" },
            { usuario: "juan.castillo", nombre: "Juan Carlos Castillo Cabrera", ur: "DGPPYEE", cargo: "Jefe de Brigada (Evacuación)", indicativo: "PULSAR" },
            { usuario: "victor.cortes", nombre: "Victor Manuel Cortés Aguilar", ur: "CONAFE", cargo: "Enlace de PC" },
            { usuario: "gio.diaz", nombre: "Giovann Eduardo Díaz López", ur: "UNADM", cargo: "Enlace de PC", indicativo: "KAPPA" },
            { usuario: "luis.chavez", nombre: "Mtro. Luis Fernando Chávez Peón Herrero", ur: "AEFCM", cargo: "Enlace de PC" },
            { usuario: "noemi.cortes", nombre: "Noemi Cortés Martinez", ur: "DGRMYS", cargo: "Enlace de PC", indicativo: "GACELA" },
            { usuario: "hugo.froget", nombre: "Hugo Fernando Froget Morales", ur: "DGRMYS", cargo: "Suplente", indicativo: "RODEO" },
            { usuario: "eduardo.espinosa", nombre: "Lic. Eduardo Adalberto Espinosa González", ur: "DGPPYEE", cargo: "Jefe de Piso", indicativo: "PERRO ROJO" },
            { usuario: "myriam.rojas", nombre: "Myriam de Lourdes Rojas Flores", ur: "DGRMYS", cargo: "Jefa de Departamento", indicativo: "BRUJA" },
            { usuario: "gustavo.gudino", nombre: "Gustavo Gudiño López", ur: "USICAMM", cargo: "Jefe de Piso", indicativo: "LOBO GRIS" },
            { usuario: "ismael.brigas", nombre: "Ismael Bringas", ur: "DGTIC", cargo: "Jefe de piso nivel 0" },
            { usuario: "hector.victoria", nombre: "Hector Victoria Cortes", ur: "SES", cargo: "Enlace y Jefe de Piso 5", indicativo: "TORO" },
            { usuario: "claudia.mora", nombre: "Claudia Alejandra Mora Duarte", ur: "CONAFE", cargo: "Suplente" },
            { usuario: "gustavo.sanchez", nombre: "Gustavo Sánchez Bazán", ur: "DGETI", cargo: "Enlace de PC" },
            { usuario: "david.alfredo", nombre: "David Alfredo Muñoz Guagnelli", ur: "DGETI", cargo: "Suplente" },
            { usuario: "oscar.valdes", nombre: "Oscar Valdes Sánchez", ur: "DGBTED", cargo: "Suplente" },
            { usuario: "ignacio.reyes", nombre: "Ignacio de los Reyes Mayorga", ur: "DGETAYCM", cargo: "Enlace de PC", indicativo: "HÉRCULES BRAVO" },
            { usuario: "marcelino.morales", nombre: "Marcelino M. Morales A.", ur: "TNM", cargo: "Médico", indicativo: "GALENO" },
            { usuario: "isidro.reyes", nombre: "Isidro Reyes López", ur: "DGTIC", cargo: "Enlace de PC", indicativo: "ODÍN" },
            { usuario: "oscar.ramirez", nombre: "Oscar Zaid Ramírez Zavala", ur: "DGGEyET", cargo: "Suplente" },
            { usuario: "hector.black one", nombre: "Hector Negrito", ur: "IMER", cargo: "Enlace PC", indicativo: "Black One" }
        ];

        let registrosGlobales = {};

        window.addEventListener('DOMContentLoaded', () => {
            sincronizarAsistencia();
            setInterval(sincronizarAsistencia, 5000);
        });

        async function sincronizarAsistencia() {
            try {
                const res = await fetch('/api/asistencia');
                const data = await res.json();
                if (data.success && data.registros) {
                    registrosGlobales = data.registros;
                    renderizarTabla(baseUsuarios);
                }
            } catch (e) {
                console.error("Error al sincronizar con el servidor:", e);
            }
        }

        function renderizarTabla(usuarios) {
            const tbody = document.getElementById('tabla-asistencia');
            if (!tbody) return;
            tbody.innerHTML = '';

            let cInmueble = 0, cCasa = 0, cComision = 0, cSin = 0;

            let usuariosOrdenados = [...usuarios].sort((a, b) => {
                const regA = registrosGlobales[a.usuario] ? 1 : 0;
                const regB = registrosGlobales[b.usuario] ? 1 : 0;
                return regB - regA; 
            });

            usuariosOrdenados.forEach(u => {
                const reg = registrosGlobales[u.usuario];

                let badgeEstatus = `<span class="px-2.5 py-1 bg-slate-100 text-slate-500 rounded-full text-[10px] font-bold border border-slate-200">Sin registrar</span>`;
                let horaTexto = '--:--';
                let obsTexto = 'Sin observaciones';

                if (reg && reg.estatus) {
                    horaTexto = reg.hora || '--:--';
                    obsTexto = reg.observaciones || 'Sin observaciones';

                    if (reg.estatus === 'En el inmueble') {
                        cInmueble++;
                        badgeEstatus = `<span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 rounded-full text-[10px] font-extrabold border border-emerald-200 shadow-xs">🏠 En el inmueble</span>`;
                    } else if (reg.estatus === 'En casa') {
                        cCasa++;
                        badgeEstatus = `<span class="px-2.5 py-1 bg-blue-100 text-blue-800 rounded-full text-[10px] font-extrabold border border-blue-200 shadow-xs">💻 En casa</span>`;
                    } else if (reg.estatus === 'En comisión') {
                        cComision++;
                        badgeEstatus = `<span class="px-2.5 py-1 bg-amber-100 text-amber-800 rounded-full text-[10px] font-extrabold border border-amber-200 shadow-xs">🚗 En comisión</span>`;
                    }
                } else {
                    cSin++;
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors border-b border-slate-100";

                tr.innerHTML = `
                    <td class="p-3">
                        <strong class="text-slate-900 block text-xs">${u.nombre}</strong>
                        <span class="text-[10px] text-blue-700 uppercase font-bold tracking-wide">UR: ${u.ur}</span>
                    </td>
                    <td class="p-3">
                        <span class="text-slate-700 block text-xs">${u.cargo}</span>
                        ${u.indicativo ? `<span class="text-[10px] text-amber-600 font-bold">Indicativo: ${u.indicativo}</span>` : ''}
                    </td>
                    <td class="p-3 text-center font-mono text-[11px] text-slate-600">
                        ${horaTexto}
                    </td>
                    <td class="p-3">
                        <div class="flex flex-col gap-1">
                            <div>${badgeEstatus}</div>
                            <span class="text-[11px] text-slate-500 italic">"${obsTexto}"</span>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('stat-total').innerText = usuarios.length;
            document.getElementById('stat-inmueble').innerText = cInmueble;
            document.getElementById('stat-casa').innerText = cCasa;
            document.getElementById('stat-comision').innerText = cComision;
            document.getElementById('stat-sin').innerText = cSin;
        }

        function filtrarLista() {
            const query = document.getElementById('buscadorPersonal').value.toLowerCase().trim();
            const filtrados = baseUsuarios.filter(u => 
                (u.nombre && u.nombre.toLowerCase().includes(query)) ||
                (u.ur && u.ur.toLowerCase().includes(query)) ||
                (u.cargo && u.cargo.toLowerCase().includes(query)) ||
                (u.indicativo && u.indicativo.toLowerCase().includes(query))
            );
            renderizarTabla(filtrados);
        }
    </script>
</body>
</html>
